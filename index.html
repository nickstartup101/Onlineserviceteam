<!-- Filters & Search Bar ພ້ອມ Search Dropdown Match-up -->
<div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between text-xs">
    <div class="flex-1 relative" id="searchWrapper">
        <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400 text-lg">search</span>
        <input type="text" id="libSearchInput" 
            onfocus="openSearchDropdown()" 
            oninput="handleSearchInput(event)" 
            placeholder="ຄົ້ນຫາຫົວຂໍ້, ເນື້ອໃນ, ຄ່າທຳນຽມ, ແບຣນ (VISA, WeChat, Alipay, PromptPay...)" 
            class="w-full pl-9 pr-8 py-2 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-brand-red/30 focus:border-brand-red bg-slate-50 focus:bg-white text-xs transition"
            autocomplete="off"/>
        
        <!-- ປຸ່ມລຶບຂໍ້ຄວາມຄົ້ນຫາ (Clear) -->
        <button type="button" id="libSearchClearBtn" onclick="clearSearchInput()" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 cursor-pointer">
            <span class="material-symbols-outlined text-base">cancel</span>
        </button>

        <!-- ⭐ Search Dropdown Results Panel -->
        <div id="libSearchDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 max-h-96 overflow-y-auto divide-y divide-slate-100 font-lao animate-in fade-in zoom-in-95 duration-150">
            <div id="libSearchDropdownList" class="p-1 space-y-0.5"></div>
        </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
        <!-- Dynamic Category Filter -->
        <select id="libCategoryFilter" onchange="filterLibraryItems()" class="border border-slate-200 rounded-xl px-3 py-2 outline-none bg-slate-50 font-semibold text-xs text-slate-700 cursor-pointer">
            <option value="ALL">ທຸກໝວດໝູ່ (All Categories)</option>
        </select>
        <button type="button" id="libToggleOutdatedBtn" onclick="toggleShowOutdated()" class="px-3 py-2 border border-slate-200 rounded-xl font-bold text-slate-600 bg-slate-50 hover:bg-slate-100 transition flex items-center gap-1 cursor-pointer">
            <span class="material-symbols-outlined text-sm">history</span> <span id="libToggleOutdatedText">ລວມ Out of date</span>
        </button>
    </div>
</div>
